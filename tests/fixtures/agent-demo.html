<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>pw-recorder v2 agent demo（第 1 页）</title>
<style>
  body { font: 15px/1.6 system-ui, -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color:#18181b }
  h1 { font-size: 19px }
  label { display:block; margin: 12px 0 4px; font-weight: 600 }
  input, select, button { font: inherit; padding: 8px 10px; border:1px solid #d4d4d8; border-radius:8px; width:100%; box-sizing:border-box }
  button { background:#2563eb; color:#fff; border:0; margin-top:16px; cursor:pointer; width:auto; padding:8px 18px }
  .row { display:flex; gap:8px; align-items:center; margin-top:12px }
  .row input { width:auto }
  fieldset { border:1px solid #e4e4e7; border-radius:10px; margin-top:20px }
  ul { list-style:none; padding:0 }
  #hover-box { padding:12px; border:1px dashed #a1a1aa; border-radius:8px }
  .hidden-action { display:none }
  .hover-box:hover .hidden-action { display:block }
  #msg { margin-top:12px; font-weight:600; color:#16a34a; min-height:22px }
</style>
</head>
<body>
  <h1>pw-recorder v2 agent demo（第 1 页）</h1>
  <p style="color:#71717a;font-size:13px">页面里只引了一个 <code>/dist/pw-agent.js</code>，右下角会自动出现录制控件。</p>

  <form id="login" onsubmit="return false">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" aria-label="Password">

    <label for="plan">Plan</label>
    <select id="plan" name="plan">
      <option value="free">Free</option>
      <option value="pro">Pro</option>
      <option value="team">Team</option>
    </select>

    <div class="row">
      <input id="remember" name="remember" type="checkbox">
      <label for="remember" style="margin:0;font-weight:400">Remember me</label>
    </div>

    <button type="submit" data-testid="login-submit">Log in</button>
  </form>

  <fieldset>
    <legend>重复元素 / hover 才可见</legend>
    <ul>
      <li><button type="button" aria-label="Row action">操作</button></li>
      <li><button type="button" aria-label="Row action">操作</button></li>
    </ul>
    <div id="hover-box" class="hover-box">
      鼠标移上去才出现按钮
      <button id="hover-btn" class="hidden-action" type="button">隐藏按钮</button>
    </div>
    <button id="dbl" type="button">双击我</button>
  </fieldset>

  <p style="margin-top:22px">
    <a id="next" href="agent-demo-2.html">下一页（测试跨页录制）</a>
  </p>

  <div id="msg"></div>

  <script>
    document.getElementById('dbl').addEventListener('dblclick', function () {
      document.getElementById('msg').textContent = 'dblclick 已触发 ✓';
    });
  </script>

  <!-- 引入即自动开始录制；data-title 用来命名导出的脚本 -->
  <script src="/dist/pw-agent.js" data-title="agent demo flow"></script>
</body>
</html>
