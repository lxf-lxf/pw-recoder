<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>pw-recorder v2 agent demo（第 2 页）</title>
<style>
  body { font: 15px/1.6 system-ui, -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color:#18181b }
  h1 { font-size: 19px }
  label { display:block; margin: 12px 0 4px; font-weight: 600 }
  input, button { font: inherit; padding: 8px 10px; border:1px solid #d4d4d8; border-radius:8px; width:100%; box-sizing:border-box }
  button { background:#16a34a; color:#fff; border:0; margin-top:16px; cursor:pointer; width:auto; padding:8px 18px }
  #result { margin-top:14px; font-weight:600; color:#16a34a; min-height:22px }
</style>
</head>
<body>
  <h1>pw-recorder v2 agent demo（第 2 页）</h1>
  <p style="color:#71717a;font-size:13px">这一页同样引了 agent；上一页的录制会通过 sessionStorage 自动接上。</p>

  <label for="note">备注</label>
  <input id="note" data-testid="note-input" placeholder="补充说明">

  <button id="finish" data-testid="finish-btn" type="button">完成</button>
  <div id="result"></div>

  <p style="margin-top:22px"><a href="agent-demo.html">返回第 1 页</a></p>

  <script>
    document.getElementById('finish').addEventListener('click', function () {
      document.getElementById('result').textContent = '已完成 ✓';
    });
  </script>

  <script src="/dist/pw-agent.js" data-title="agent demo flow"></script>
</body>
</html>
